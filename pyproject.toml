[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-pio-trace"
version = "0.6.1"
description = "Safe static parser, cycle-oriented RP2040 PIO emulator, and logic-analyzer trace renderer for MicroPython rp2.asm_pio programs"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later AND MIT"
license-files = [
  "LICENSE",
  "LICENSES/MICROPYTHON-MIT.txt",
  "THIRD_PARTY_NOTICES.md",
]
keywords = ["raspberry-pi-pico", "rp2040", "pio", "micropython", "logic-analyzer", "emulator"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
  "Topic :: System :: Hardware",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://blog.stuehler-training.de/"
Documentation = "https://blog.stuehler-training.de/"

[project.scripts]
pico-pio-trace = "pico_pio_trace.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
browser-test = ["pytest>=8,<10", "playwright>=1.45,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pico_pio_trace*"]

[tool.setuptools.package-data]
pico_pio_trace = ["web/*.html", "web/*.css", "web/*.js", "web/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
